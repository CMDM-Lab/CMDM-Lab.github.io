# KNOWN GAP -- author name variants.
#
# The three DOIs above surfaced a systematic hole rather than three one-offs.
# Publisher metadata records the PI's name in at least three forms:
#
#     "Yufeng Jane Tseng"   <- the only form the tier-1 PubMed query matches
#     "Yufeng J. Tseng"
#     "Y. Jane Tseng"
#
# A paper indexed under one of the latter two, and lacking an ORCID link, is
# invisible to both trusted sources and can only arrive through the untrusted
# affiliation query -- which is exactly where these three were sitting.
#
# Broadening the PubMed query is not a safe fix on its own: "Tseng Y Jane" and
# "Tseng Yufeng J" return 58 and 87 hits because PubMed matches author initials
# as prefixes, so they pull in unrelated people rather than just the variants.
#
# The durable fix is upstream: link the missing papers to the ORCID record at
# https://orcid.org/0000-0002-8461-6181. ORCID is already the most complete
# source at 101 works, and anything added there is picked up automatically on
# the next sync with no entry needed in this file.
