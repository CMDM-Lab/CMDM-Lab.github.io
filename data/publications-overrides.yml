# Human decisions layered over the automated publication sync.
#
# scripts/fetch-publications.mjs reads this file on every run. It is the only
# place to correct the generated data/publications.yml, which is overwritten
# wholesale each time and must never be hand-edited.
#
# Four sections:
#
#   include:  DOIs from data/publications-review.yml that are confirmed to be
#             this lab's work. The review queue exists because the PubMed
#             affiliation query name-collides with another NTU researcher, so
#             every entry here represents a decision someone made.
#
#   exclude:  DOIs that are NOT this lab's work, or that should not appear for
#             any other reason. Applied to trusted sources too, so this also
#             suppresses a bad ORCID record.
#
#   patch:    Per-DOI field overrides, for when Crossref metadata is wrong.
#
#   manual:   Entries no API carries at all. Note that conference abstracts,
#             patents and books live in publications-legacy.yml instead -- use
#             this only for a journal article that is genuinely unreachable.

include:
  # Confirmed by cot on 2026-08-22. All three were verified against Crossref
  # before being added: each lists Tseng as an author alongside known lab
  # members, which is the check that matters here -- a DOI alone does not
  # distinguish this lab from the other Tseng YJ at NTU.
  #
  # Note why the automated sources missed all three: Crossref records the
  # author as "Y. Jane Tseng" or "Yufeng J. Tseng", not "Yufeng Jane Tseng",
  # and none of them carry an ORCID for her. So neither the ORCID profile nor
  # the PubMed full-name query could find them. See the note at the end of this
  # file.

