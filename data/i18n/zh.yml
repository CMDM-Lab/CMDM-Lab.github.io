home_title: 計算分子設計與代謝體實驗室
home_description: 國立臺灣大學計算分子設計與代謝體實驗室（CMDM Lab），由曾宇鳳教授主持，研究電腦輔助藥物設計、代謝體學生物標記偵測，以及人工智慧應用於新藥開發。
about_title: 關於實驗室
about_description: 認識國立臺灣大學計算分子設計與代謝體實驗室的研究方向、實驗室沿革與聯絡方式。
research_title: 研究內容
research_description: CMDM 實驗室的研究主題涵蓋計算分子設計、藥物毒性預測、代謝體學生物標記偵測與精準醫學。
publications_title: 學術發表
publications_description: 國立臺灣大學計算分子設計與代謝體實驗室的期刊論文、會議論文、專利與專書著作完整清單。
honors_title: 榮譽事蹟
honors_description: CMDM 實驗室與曾宇鳳教授獲獎紀錄，包含國家新創獎、IBM Faculty Award 與未來科技突破獎等。
members_title: 實驗室成員
members_description: 國立臺灣大學計算分子設計與代謝體實驗室的指導教授、博士後研究員、博碩士班學生與歷屆畢業成員名單。
courses_title: 課程
courses_description: 曾宇鳳教授於國立臺灣大學開設之課程資訊。
services_title: 軟體服務
services_description: CMDM 實驗室開發並公開提供的網頁服務與分析工具，包含 3Omics、LipidPedia、CypRules、GC2MS、Chromaligner 等。
