# `*_title` and `*_description` feed the <title> and <meta name="description">
# of each page. They are not decoration: the old site gave every one of its
# eight pages the same title and an empty description, so a search engine had
# nothing to tell them apart. Keep each title distinct and each description a
# self-contained sentence naming the lab.

