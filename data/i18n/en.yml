home_title: Computational Molecular Design and Metabolomics Lab
home_description: The CMDM Lab at National Taiwan University, led by Prof. Yufeng Jane Tseng, works on
  computer-aided drug design, biomarker detection in metabolomics, and AI for drug discovery.
about_title: About the Lab
about_description: Research directions, history, and contact information for the Computational
  Molecular Design and Metabolomics Lab at National Taiwan University.
research_title: Research
research_description: CMDM Lab research spans computational molecular design, predictive toxicology,
  metabolomic biomarker detection, and precision medicine.
publications_title: Publications
publications_description: Complete list of journal articles, conference papers, patents, and books
