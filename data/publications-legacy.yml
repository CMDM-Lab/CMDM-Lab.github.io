# ── From the CV ─────────────────────────────────────────────────────────────
# THE SAME TWO INVENTIONS RECUR ACROSS FIFTEEN JURISDICTIONS, which is what the
# list looks like when a family is filed internationally rather than a sign of
# duplicated entries: one on the use of known compounds as D-amino acid oxidase
# inhibitors, one on substituted benzimidazole derivatives as DAAO inhibitors.
#
# THE DATES ARE NOT ALL THE SAME KIND OF DATE. The first six carry grant dates.
# The September 2017 and April 2015 groups carry the family's priority date --
# their numbers are application numbers, several from later series than the year
# suggests -- so those years say when the family was filed, not when each office
# granted it. The CV presents them this way and so does this file; a reader who
# needs grant dates needs the register.
#
# The Taiwanese patents keep their Chinese titles and inventor names, as a
# citation does: that is what the certificate says.
- Yufeng Jane Tseng, Chung-Ming Sun, Wen-Sung Lai, Hai-Gwo Hwu, Chih-Min Liu, Yu-Li Liu, “Use of known compounds
