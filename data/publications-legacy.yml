# Publications that the automated ORCID + Crossref sync cannot reach.
#
# Conference abstracts, patents and books are not registered as DOIs the way
# journal articles are, so scripts/fetch-publications.mjs will never find them.
# This file is their only record: it was migrated out of contents/honor_zh.html
# and the never-routed contents/publication_zh.html, and is now hand-maintained.
#
# Entries are free-text citations, matching how the old site rendered them. The
# trailing asterisk on an author marks the corresponding author.
