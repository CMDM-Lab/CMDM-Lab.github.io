# Publications that the automated ORCID + Crossref sync cannot reach.
#
# Conference abstracts, patents and books are not registered as DOIs the way
# journal articles are, so scripts/fetch-publications.mjs will never find them.
# This file is their only record: it was migrated out of contents/honor_zh.html
# and the never-routed contents/publication_zh.html, and is now hand-maintained.
#
# Entries are free-text citations, matching how the old site rendered them. The
# trailing asterisk on an author marks the corresponding author.
#
# EXTENDED FROM THE PI'S AUGUST 2026 CV (YufengJaneTseng-CV-202608-chi-updated
# .docx, supplied by the lab on 2026-08-31). All three sections stopped well
# short of the record: conference papers at 2016, patents at the early filings,
# and books at the two English chapters. Thirty-three conference papers,
# twenty-nine patents and five books came off the CV.
#
# NEW ENTRIES KEEP THE CV'S OWN CITATION FORM rather than being recast into the
# migrated entries' one. There is no single migrated form to match -- the
# scraped citations use semicolons in one entry and commas in the next, and
# spaces before commas in both -- so recasting sixty-seven citations would mean
# inventing a house style while retyping author lists and patent numbers by
# hand, and a mistyped author list or patent number is a worse fault than two
# citation styles on one page. Light typographic tidying was done and nothing
# else: doubled spaces closed up, a stray "and," and "YJ. Tseng" fixed, and the
# CV's 本人為通訊作者 annotations dropped, since the asterisk already says it.
conference_papers:
# ── 2017 to 2024, from the CV ────────────────────────────────────────────────
# TWO THINGS THE CV HAS HERE ARE DELIBERATELY NOT BELOW.
#
# The ECCV 2024 paper on dense normalisation, which the CV lists twice -- once
# as the proceedings entry and once as the Milan presentation. The automated
# sync already reaches it: it is in publications.yml as a Lecture Notes in
# Computer Science chapter with a DOI, so putting it here too would show one
# paper twice on the page. This file is for what the sync cannot reach.
#
# Two of the three ACS Fall 2026 abstracts. The lab reports three; the GreenN
# poster below is the one whose submission record it has supplied (2026-08-31),
# and the other two are still out.
#
# One of them is in the CV: "Predicting human liver microsomal stability with a
# regressive graph neural network" (Chicago, 23-27 August 2026), whose author
# list the CV gives as "YJ Tseng*" followed by "(待補author)" -- authors still to
# be added. Publishing it as it stands would credit the PI alone for work the CV
# itself says has other authors, which on a lab's own site under-credits a
# student. Both go in when the lab supplies the details.
#
# ── ACS Fall 2026 ───────────────────────────────────────────────────────────
# From the ACS abstract submission record, supplied by the lab on 2026-08-31:
# General Posters in Chemical Health and Safety, Division of Chemical Health &
# Safety, in-person poster. The meeting ran 23-27 August 2026 and this file
# takes it as presented; if the poster was withdrawn, the entry should go.
#
# THE SUBMITTED TITLE READS "(Greenn)". It is written "(GreenN)" here, which is
# the system's own name and the spelling every other page on this site uses --
# the ACS system title-cased it. Nothing else about the title is changed.
#
# NO ASTERISK IS ASSERTED FROM THE RECORD: it names authors and institutions and
# does not say who is corresponding. The asterisk follows this file's convention
# for the PI as last author, as every other lab entry here does.
#
# Three of the nine authors are at the Ministry of Environment's Chemicals
# Administration, the agency that commissions GreenN. The citation form in this
# file carries no institutions, so that is recorded here instead.
