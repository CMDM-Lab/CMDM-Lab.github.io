# YEARS ARE CALENDAR YEARS -- the year the 口試 was passed, which is
# `dc.date.accepted` in NTU's repository. Not 學年度, and not the repository's
# 出版年, both of which differ for anyone who defended in January or over the
# summer. The lab settled this on 2026-08-23; three rows here moved as a result
# and each says so. Checked against the repository for 45 of the 65 people on
# the page, the rest having no record there to check.
#
# `thesis_url` is the record in NTU's repository, and is what makes the year
# above checkable: scripts/check-thesis-records.mjs reads 口試通過日期 from it
# on a schedule. 34 of these rows have one; the rest are people the repository
# has no record of under that name. Add one only after confirming the record is
# the right person's -- the advisor field is the tell, and the script rejects a
# record that is not 曾宇鳳's.
#
# Graduates recorded on the pre-2026 website, recovered from the old
# contents/member_zh.html table. The CMDM-Lobe vault has no pages for these
# 47 people -- this file is the only record of that stretch of lab history, so
# it is hand-maintained here rather than generated. Recent graduates come from
# the vault via scripts/sync-members.mjs instead.
