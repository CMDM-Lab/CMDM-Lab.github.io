# Public-facing member details that the CMDM-Lobe vault does not carry.
#
# scripts/sync-members.mjs merges this file over the vault-derived roster. The
# vault owns WHO is in the lab; this file owns HOW they are presented publicly.
#
# Two sections:
#
#   members:    keyed by the Chinese name exactly as it appears in the vault
#               roster. Any field here wins over the vault. `publish: false`
#               keeps someone off the site entirely -- this is the mechanism for
#               anyone who asks not to be listed.
#
#   additional: people who are not in the vault roster table at all (faculty,
#               administrative and research staff, postdocs). Written in the
#               same shape the site consumes.
#
# EMAIL POLICY. Personal addresses are not published. Faculty, staff and
# postdocs list a professional contact because being reachable is the point of
# their entry. Current students list an institutional address only. Alumni list
# none: their personal mailboxes were on the old site, but they have left, and a
# lab page is not the place to keep publishing them. Removing an address here is
# always safe; adding a personal one needs that person's say-so.

members:
  # ── Romanised names ────────────────────────────────────────────────────
  # These matter for search: people look for "Ying-An Lin", not only for the
  # Chinese characters. But a guessed romanisation is worse than none -- it is
  # confidently wrong, and it makes the person harder to find rather than easier.
  #
  # So each one below carries its source, and a name that has no source other
  # than my reading of the characters is simply absent. Five were removed on
  # 2026-08-22 for exactly that reason after one of them (張家瑜) turned out to
  # be wrong.
  #
  # The best source is the publication record: Crossref carries the form the
  # person actually publishes under, which is also the form anyone searching for
  # them will type.
  # ---------------------------------------------------------------------------
  林盈安:
    name_en: Ying-An Lin # from the previous site
  楊淯元:
    name_en: Yu-Yuan Yang
  徐銘聰:
    name_en: Ming-Tsung Hsu
