# ── Withheld thesis titles ─────────────────────────────────────────────────
#
# A deposited thesis is a public bibliographic record and the alumni table
# prints it. These ones are not public yet: the thesis waits on the manuscript,
# so NTU's repository has no record to link and the title is not the lab's to
# announce. The lab said so of both of them on 2026-09-02.
#
# For anyone named here, no `thesis`, `thesis_en` or `thesis_url` may appear --
# not in the `members` map above, not in `additional`, and not in
# alumni-historical.yml. Their alumni row publishes the year, the unit and the
# level, and leaves the title column empty.
#
# 李哲宇's title was published here from 2026-08-23, on the lab's own word at the
# time, and came down on 2026-09-02. That is why this list exists rather than a
# deleted line: a title that is merely absent gets helpfully filled in again by
# whoever next finds a cover page, and "the thesis is embargoed" is not something
# an empty cell can say by itself. The test "a withheld thesis title stays
# withheld" in tests/content.test.mjs is the part that actually stops it.
#
# A year, not just a name, because a name is not a person: the lab's other
# 張家瑜 graduated in 2019, her thesis is in the repository, and it is published
# here as it should be. Same identity rule as `alumnusKey` in src/lib/data.ts --
# the test read this list as bare names first and caught the collision at once.
#
# Take someone off this list when the manuscript is out and the repository has
# the record -- then add the title with its handle, like everyone else's.
