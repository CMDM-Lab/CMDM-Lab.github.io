# Awards and recognition, newest first.
#
# Migrated from contents/honor_zh.html by
# scripts/migration/extract-legacy-content.py, and hand-maintained since. There
# is no API to pull awards from, so new ones are added here by hand. The
# migration script refuses to overwrite this file without --force.
#
# ONE LIST, deliberately. The old site kept two overlapping lists -- a full
# record and a shorter home-page teaser -- and carrying both over put the same
# award on the honours page twice. The home page now takes the newest entry from
# this list instead.
#
# A `citation` is either a plain string, used for both locales, or a
# `{zh, en}` pair. The pair form is preferred for new entries; string-only
# entries are Chinese-only holdovers from the old site, and the English page
# falls back to them. `getHonors()` resolves this.
#
# House style, from the design system's content rules: the year first, then one
# declarative sentence, then bracketed sources at the end. People are third
# person and always carry their title. No emoji, no exclamation marks.

# ENGLISH AWARD NAMES ARE DESCRIPTIVE RENDERINGS of the Chinese originals, not
# NTU's own English titles -- the announcement pages are Chinese-only. Replace
# them if the university publishes official English names. The Chinese name is
# the authoritative one, and the source link carries it.

achievements:
  # Announced 2026-06-15.
  - citation:
      zh: 2026 年，曾宇鳳教授指導的師生團隊榮獲「臺大 1975 級電機系系友捐贈科技研究創新獎勵」特別獎。
      en: 2026, a student team supervised by Professor Yufeng Jane Tseng received the Special
        Award of the NTU Electrical Engineering Class of 1975 Alumni Technology Research
        Innovation Award.
    links:
      - label: NTU BEBI
        url: https://www.bebi.ntu.edu.tw/?p=6889

  # Two issue numbers, both correct: the paper appeared in the 59(46) special
  # issue and was picked up for the cover of 59(51) afterwards. Confirmed by the
  # lab on 2026-08-22. Stated explicitly because the Research page's meta line
  # carries 59(46) from Crossref, and without this the pair reads as a typo.
  - citation:
      zh: 2025 年，發表於《Environmental Science & Technology》59 卷 46 期特刊的 DeePFAS 論文，獲選為同卷 51
        期封面。
      en: 2025, the DeePFAS paper, published in a special issue of Environmental Science &
        Technology 59(46), was selected as the cover art of issue 59(51).
    links:
      - label: ACS Publications
        url: https://pubs.acs.org/esthag/issue/59/51
      - label: DOI
        url: https://doi.org/10.1021/acs.est.5c09769

