  - citation:
      zh: 2026 年，曾宇鳳教授指導的師生團隊榮獲「臺大 1975 級電機系系友捐贈科技研究創新獎勵」特別獎。
      en: 2026, a student team supervised by Professor Yufeng Jane Tseng received the Special
