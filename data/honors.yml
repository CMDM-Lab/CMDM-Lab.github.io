# Awards and recognition, newest first.
#
# Migrated from contents/honor_zh.html by
# scripts/migration/extract-legacy-content.py, and hand-maintained since. There
# is no API to pull awards from, so new ones are added here by hand. The
# migration script refuses to overwrite this file without --force.
#
# ONE LIST, deliberately. The old site kept two overlapping lists -- a full
# record and a shorter home-page teaser -- and carrying both over put the same
# award on the honours page twice. The home page now takes the newest entry from
# this list instead.
#
# A `citation` is a `{zh, en}` pair. `getHonors()` still accepts a plain string
# and uses it for both locales -- that was how the entries migrated from the old
# site arrived -- but there are none left, and tests/content.test.mjs now fails
# on a new one, because a Chinese-only entry shows as Chinese in the middle of
# the English list and nothing else says so.
#
# House style, from the design system's content rules: the year first, then one
# declarative sentence, then bracketed sources at the end. People are third
# person and always carry their title. No emoji, no exclamation marks.

# ENGLISH AWARD NAMES ARE DESCRIPTIVE RENDERINGS of the Chinese originals, not
# NTU's own English titles -- the announcement pages are Chinese-only. Replace
# them if the university publishes official English names. The Chinese name is
# the authoritative one, and the source link carries it.
#
# ONE NAME IS STILL IN CHINESE, 安成醫藥基金會 in the 2015 entry. No English name
# for the foundation could be found, and inventing a romanisation for an
# organisation is how a reader ends up unable to look it up -- the same reason
# five guessed romanisations came out of members-overrides.yml. It reads as a
# Chinese proper noun in an English sentence, which is what it is. Replace it if
# the lab knows the foundation's own English name.
#
# 創新創業激勵計畫 is "From IP to IPO", the programme's own English name rather
# than a translation of the Chinese, and news.yml calls it the same thing.

achievements:

# ── Entries added from the PI's August 2026 CV ──────────────────────────────
# Twenty-two awards below came from YufengJaneTseng-CV-202608-chi-updated.docx,
# supplied by the lab on 2026-08-31, and are marked "2026-08 CV". Before that
# import this list ran from 2015 to 2026 but skipped most of the PI's own awards
# between 2019 and 2024 -- the National Innovation Awards, the Future Tech Expo
# prizes, the university's teaching and college awards -- because it had grown
# by whatever the lab happened to mention rather than from a record.
#
# THE TWENTY-TWO CARRY NO SOURCE LINK AND ARE NOT MEANT TO. The CV is their
# source. Links were chased on 2026-08-31 and most of these awards simply do not
# have a public announcement to link: the college does not publish its award
# recipients, and the National Innovation Awards put their winners inside images.
# The lab's instruction that day settles the standing rule -- where there is no
# reference, none is added, and the PI's own record is taken as correct. Two
# older entries already stood this way (the Garmin scholarship, the 11th BEBI
# cycle); it is the house position for CV-sourced entries now, not a shortfall.
#
# So: do not re-run that search expecting to find something. If an announcement
# does turn up, adding it is welcome -- these are lines a link can hang on.
#
# WITHIN A YEAR THEY FOLLOW THE CV'S OWN ORDER. Everywhere else on this page
# entries inside a year are ordered by announcement date, which is what the
# comments above them record; for these there is no announcement date to order
# by, so the CV's sequence stands in. Their placement between years is real.
#
# AWARD NAMES: the same rule as the rest of the file. The Chinese is the
# authoritative name and the English is a descriptive rendering, not the
# awarding body's own English title. 景康 stays in Chinese inside its English
# sentence, as 安成醫藥基金會 does further down and for the same reason -- a
# guessed romanisation is how a reader ends up unable to look an organisation up.
#
# THE TITLE 教授 IS ANACHRONISTIC in the 2005 and 2001 entries: she was a
# postdoctoral researcher and a doctoral student then. It is kept because this
# page's rule is that people carry their title, and the sentence identifies who
# won rather than claiming what she was at the time.
  # The college's own winners list is dated 2026-05-28 and the lab's note here
  # said 2026-06-15; the earlier date is the announcement, so it is the one used.
  #
  # TWO AWARDS FROM ONE PROGRAMME, and they were one line until the lab pointed
  # at the list (2026-08-23). Ten groups won across the college: one 特別獎, which
  # is this, and nine others, one of which is 何明洋's 個人獎 below.
  #
  # WHAT THE SPECIAL AWARD WAS FOR was missing, and the list says: the hackathon
  # project with the Chemicals Administration, top five of 190 teams. That is the
  # 2025 entry further down, so the same work is on this page twice under two
  # awards -- which is the fact, not a duplicate, and each citation names its own
  # award.
  #
  # 師生團隊 stays, though the list names fourteen students and no one else: the
  # award is a student one and the postdoc on the hackathon team is not on it.
  # The team that did the work is what the sentence describes.
