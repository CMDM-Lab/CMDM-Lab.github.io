# Awards and recognition, newest first.
#
# Migrated from contents/honor_zh.html by
# scripts/migration/extract-legacy-content.py, and hand-maintained since. There
# is no API to pull awards from, so new ones are added here by hand. The
# migration script refuses to overwrite this file without --force.
#
# ONE LIST, deliberately. The old site kept two overlapping lists -- a full
# record and a shorter home-page teaser -- and carrying both over put the same
# award on the honours page twice. The home page now takes the newest entry from
# this list instead.
#
# A `citation` is either a plain string, used for both locales, or a
# `{zh, en}` pair. The pair form is preferred for new entries; string-only
# entries are Chinese-only holdovers from the old site, and the English page
# falls back to them. `getHonors()` resolves this.
#
# House style, from the design system's content rules: the year first, then one
# declarative sentence, then bracketed sources at the end. People are third
# person and always carry their title. No emoji, no exclamation marks.

