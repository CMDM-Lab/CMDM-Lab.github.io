  # Two issue numbers, both correct: the paper appeared in the 59(46) special
  # issue and was picked up for the cover of 59(51) afterwards. Confirmed by the
  # lab on 2026-08-22. Stated explicitly because the Research page's meta line
  # carries 59(46) from Crossref, and without this the pair reads as a typo.
  - citation:
      zh: 2025 年，發表於《Environmental Science & Technology》59 卷 46 期特刊的 DeePFAS 論文，獲選為同卷 51
        期封面。
      en:  2025, the DeePFAS paper, published in a special issue of Environmental Science &
        Technology 59(46), was selected for the cover of issue 59(51).
    # The cover itself, supplied by the lab on 2026-08-22. It corroborates the
    # entry: the masthead reads Volume 59, Number 51, December 30, 2025, and the
    # cover carries both the special issue title and DeePFAS.
    #
    # The credit names ACS because the composed cover -- masthead, layout,
    # ACS Publications footer -- is the publisher's, whatever the provenance of
    # the artwork on it. If the lab would rather show only its own artwork
    # without the journal's furniture, that is a different file.
    #
    # Resized here from the 2453x3262, 7.6 MB original to 1600px on the long
    # edge (309 KB). Nothing in the build resizes anything.
    images:
      - src: /img/honors/2025-deepfas-est-cover.jpg
        alt:
          zh: 《Environmental Science & Technology》59 卷 51 期封面，主題為非目標式環境分析，並標示 DeePFAS。
          en: Cover of Environmental Science & Technology 59(51), the non-targeted environmental
            analysis special issue, featuring DeePFAS.
        credit:
          zh: 《Environmental Science & Technology》59 卷 51 期封面，2025 年 12 月 30 日。© American
            Chemical Society。
          en: Cover of Environmental Science & Technology 59(51), 30 December 2025.
            © American Chemical Society.
    links:
      - label: ACS Publications
        url: https://pubs.acs.org/esthag/issue/59/51
      - label: DOI
        url: https://doi.org/10.1021/acs.est.5c09769

  # Results announced late November 2025, which is why this sits above the
  # publication award below (announced 2025-11-25).
  #
  # The hackathon's own announcement page is no longer reachable -- the lab
  # reports it was taken down or hidden. The organiser's standing "past winning
  # teams" index is linked instead, which still lists the team under 2025, and
  # the two NTU announcements carry the award tier. All three were checked on
  # 2026-08-22.
  # The English name is the project's own, read off the ceremony backdrop and the
  # official project card, both in the photographs below: "AI-Powered Green
  # Chemistry Diagnostic Advisor". My earlier "an AI-assisted green chemistry
  # diagnostic system" was a description standing in for a name I did not have.
  - citation:
      zh: 2025 年，曾宇鳳教授帶領師生團隊攜手環境部化學署參與 2025 總統盃黑客松，以「AI 綠色化學智匯診斷家」獲卓越團隊獎。
      en: 2025, Professor Yufeng Jane Tseng led a faculty and student team to the
        Presidential Hackathon 2025 alongside the Ministry of Environment's Chemicals
        Administration, receiving the Team Excellence Award for "AI-Powered Green Chemistry
        Diagnostic Advisor".
    # Supplied by the lab on 2026-08-22, from the 2025-12-14 ceremony.
    #
    # The alt text describes the scene without naming anyone. The people in a
    # group photograph have not agreed to be identified by name on this site,
    # and a caption naming them would be published far more widely than the
    # photograph itself -- alt text is read out, indexed and translated.
    #
    # Both were resized here: the ceremony photograph from 4743x3162 / 1.4 MB to
    # 1600px on the long edge, and both renamed off the camera's and the
    # messaging app's own filenames.
    images:
      - src: /img/honors/2025-hackathon-ceremony.jpg
        alt:
          zh: 2025 總統盃黑客松頒獎典禮，得獎團隊與總統在「AI 綠色化學智匯診斷家」的看板前合影。
          en: The winning team with the President at the 2025 Presidential Hackathon awards
            ceremony, in front of a screen reading "AI-Powered Green Chemistry Diagnostic
            Advisor".
        credit:
          zh: 2025 總統盃黑客松頒獎典禮，2025 年 12 月 14 日。
          en: 2025 Presidential Hackathon awards ceremony, 14 December 2025.
      - src: /img/honors/2025-hackathon-project-card.jpg
        alt:
          zh: 「AI 綠色化學智匯診斷家」專案介紹卡，說明本工具由環境部化學物質管理署與臺大合作，以 AI 代理人技術在既有 SAS
            架構上開發自主綠色化學替代診斷工具。
          en: Project card for "AI-Powered Green Chemistry Diagnostic Advisor", describing an
            autonomous green-chemistry substitution tool built with AI agent technologies on
            the existing SAS framework, in collaboration between the Ministry of Environment's
            Chemicals Administration and National Taiwan University.
        credit:
          zh: 2025 總統盃黑客松國內松專案介紹卡。
          en: Project card, 2025 Presidential Hackathon domestic track.
    links:
      - label: Presidential Hackathon
        url: https://presidential-hackathon.taiwan.gov.tw/teams
      - label: NTU EECS
