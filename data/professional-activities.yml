# Editorial service, society and programme committees, grant review, invited
# talks and journal review.
#
# Migrated from contents/prof_acts_zh.html -- a page that existed but was never
# reachable: no router entry and no navigation link pointed at it.
#
# REWRITTEN FROM THE PI'S AUGUST 2026 CV (YufengJaneTseng-CV-202608-chi-updated
# .docx, supplied by the lab on 2026-08-31). What the migration left here was
# the oldest content on the site: the committee list stopped in 2013, the talks
# in 2012 and the review list in 2012, so a service record that now runs to 2025
# was published as though it had ended thirteen years ago.
#
# ENTRIES ARE EITHER A PLAIN STRING OR A {zh, en} PAIR. The file arrived as
# English-only strings and getProfessionalActivities() had no locale, so the
# Chinese page carried an entirely English service record. Half of what the CV
# lists is Chinese -- ministry review panels, university committees, domestic
# symposia -- and it now reads in the right language on each page. A plain
# string is still the right shape for a talk title or a journal name, which is
# the same text either way; pickLocale() uses it for both locales.
#
# CHINESE-NAMED BODIES KEEP THEIR CHINESE NAMES INSIDE THE ENGLISH STRINGS, the
# same rule honors.yml follows with 安成醫藥基金會: a domestic symposium or
# foundation usually publishes no English name, and a translation invented here
# is how a reader ends up unable to look it up. Ministry and agency names are
# the exception -- those have official English names and they are used.
#
# FOUR SECTIONS WHERE THERE WERE THREE. The migrated program_committee list
# already held editorial-advisor entries, so its old label -- 國際會議程序委員會,
# "Technical Program Committees" -- was wrong about its own contents before any
# of this. Editorial work and grant review are their own sections now.

