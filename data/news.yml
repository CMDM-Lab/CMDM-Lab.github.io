# Lab news. The full list is /news/; the home page shows the newest few and links
# there. getNews() sorts by year, so an item recorded late does not have to be
# inserted in the right place -- but keep the file readable anyway.
#
# Migrated from the hard-coded list in contents/index_zh.html. Hand-maintained:
# add new items at the top.
#
# BOTH LANGUAGES, always. `text` is a zh/en pair and getNews() falls back to the
# Chinese when there is no English, so an untranslated item renders as Chinese in
# the middle of the English archive and nothing complains -- which is what the
# whole page was until 2026-08-23, every item having been a plain string. A test
# in tests/content.test.mjs fails on a string or a half-filled pair now.
#
# A link `label` stays a plain string when it is a name: TechNews and Stanford
# Medicine are the same word in both languages. It becomes a pair when it is a
# word, which is 照片 and 長庚大學.
#
# TWO THINGS THE MIGRATION LEFT, both fixed on 2026-08-22 and both now covered
# by tests, because neither is visible in a diff of this file:
#
# 1. The old page's anchor text stayed inside `text` while the anchors were also
#    extracted into `links`, so the rendered item printed every label twice:
#    "...提高先導藥物發現效率。 [Global Bio & Investment] [Global Bio & Investment]".
# 2. The URLs were relative to the old site's layout (`../img/...`, `../SPARK`,
#    `files/...`). Resolved against /news/ they all 404'd. The targets are in
#    public/, so they are root-absolute now; `../SPARK` had no target at all and
#    points at the Stanford magazine article in public/files instead.
news:
# Verified on 2026-08-22 against the host's own announcement page. The gap
# between this and the 2018 items below is real, not a lapse in maintenance: the
# lab's public record for 2019-2024 is awards, which live in honors.yml.
- text:
    zh: 2021年9月起實驗室承接「高風險化學物質之安全替代化學物質搜尋、評估及篩選系統」GreenN（SAS）計畫，由環境部化學物質管理署委辦，持續進行中
    en: >-
      Since September 2021 the lab has run GreenN (SAS), the Searching, Assessment
      and Screening System for Safer Alternative Chemicals, commissioned by the
      Chemicals Administration of the Ministry of Environment and ongoing
  links:
