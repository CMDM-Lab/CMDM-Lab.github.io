  biography_en:
    - Professor Yufeng Jane Tseng graduated from the School of Pharmacy at National Taiwan
      University in 1997 and took her doctorate in medicinal chemistry and pharmacognosy at
      the University of Illinois at Chicago in 2002. She was a postdoctoral researcher at the
      University of Illinois at Chicago from 2003 and at the National Center for Biotechnology
      Information (NCBI) of the National Institutes of Health from 2005.
    - She returned to Taiwan in 2006 as an assistant professor in National Taiwan University's
      Department of Computer Science and Information Engineering, jointly appointed at the
      Graduate Institute of Biomedical Electronics and Bioinformatics, and at the same time
      took charge of the Metabolomics Core Laboratory at the university's Center of Genomic
      Medicine and of the molecular modelling group at its Drug Research Center. She directed
      the Drug Research Center from 2015 to 2021, and has headed its drug informatics division
      since 2021.
    - She has been guest editor-in-chief of a special issue of the Journal of Combinatorial
      Chemistry and High Throughput Screening, editorial advisor to the Journal of Molecular
      Graphics and Modelling and to the Journal of Combinatorial Chemistry and High Throughput
      Screening, and a member of the programming board of the American Chemical Society's
      Division of Computers in Chemistry, chairing its drug discovery symposium. She is
      currently an associate editor of the Journal of Cheminformatics and an editorial board
      member of Scientific Data and of the Journal of Computer-Aided Molecular Design, and has
      chaired the Division of Sustainability and Green Technology of the ACS Division of
      Agricultural and Food Chemistry since 2024.
