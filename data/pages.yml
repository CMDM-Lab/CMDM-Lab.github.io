# Representative work, migrated from contents/research_zh.html. Each entry keeps
# the abstract excerpt the old page showed.
research_highlights:
  - title: "Mutagenicity in a Molecule: Identification of Core Structural Features of Mutagenicity
      Using a Scaffold Analysis"
    excerpt: With advances in the development and application of Ames mutagenicity in silico
      prediction tools, the International Conference on Harmonisation (ICH) has amended its M7
      guideline to reflect the use of such prediction models for the detection of mutagenic activity
      in early drug safety evaluation processes.
    image: /img/research.png
  - title: An efficient and robust fatty acid profiling method for plasma metabolomic studies by gas
      chromatography-mass spectrometry
    excerpt: Targeted metabolomic analysis of fatty acids has linked the dysregulation of fatty acids
      to many diseases. This study selected five frequently used fatty acid derivatization methods
      for comparison.
  - title: A portable micro gas chromatography system for volatile compounds detection with 15 ppb of
      sensitivity
    excerpt: Existing non-invasive lung cancer diagnostic equipment has difficulty detecting
      early-stage lung cancer, as abnormal tissue is smaller than 0.5 cm. Volatile organic compounds
      from human breath gas can provide biomarkers for human disease, especially for lung cancer.
  - title: Using the Matrix-Induced Ion Suppression Method for Concentration Normalization in
      Cellular Metabolomics Studies
    excerpt: Most cellular metabolomics studies control only cell numbers or protein content without
      adjusting the total metabolite concentration, mainly because of the lack of an effective
      concentration normalization method.
    image: /img/research_2.png
  - title: Synthesis and inhibitory effects of novel pyrimido-pyrrolo-quinoxalinedione analogues
      targeting nucleoproteins of influenza A virus H1N1
    excerpt: The influenza nucleoprotein (NP) is a single-strand RNA-binding protein and the core of
      the influenza ribonucleoprotein particle, serving many critical functions for influenza
      replication.

