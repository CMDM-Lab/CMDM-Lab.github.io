# Editorial prose for the pages that are not driven by a synced dataset.
#
# Migrated from contents/about_zh.html, contents/research_zh.html and
# contents/course_zh.html.
#
# TRANSLATION GAP -- needs the lab's attention.
#
# The old site had `_zh` variants of the About and Research pages, but their
# bodies were English prose, identical to the English pages. There is no Chinese
# text for this material anywhere in the repository. Rather than machine
# translate descriptions of the lab's own research -- which would put words
# about scientific results into the lab's mouth and risk distorting them -- the
# English text is reused in both locales and flagged here.
#
# `zh` blocks below marked `same_as_en: true` are the ones awaiting real
# Chinese copy. Replace the value with Chinese prose and drop the flag.

about:
  en:
    # Block scalars throughout: this prose contains colons and quotes that YAML
    # would otherwise read as structure.
    paragraphs:
      - >-
        Our research focuses on Computational Molecular Design and Biomarker Detection in
        Metabolomics, which involves the development of new algorithms and tools to identify and
        design molecular structures for the targeted use. Our research is published in
        international journals of Molecular Structure Design, and is presently being used in the
        development of clinical biomarkers in both Taiwan and the U.S.
      - >-
        Our laboratory was involved in six drug development projects in the National Research
        Program for Biopharmaceuticals (NRPB). Our research is not only intended to be included in
        the "Platform for lead optimization and preclinical safety screening project" for years to
        come, but also to contribute to the National Science Technology Program for Biotechnology
        and Pharmaceuticals in collaboration with departments of chemistry and pharmacy of various
        domestic universities in Taiwan. Our partners include China Medical University, National
        Taiwan University, National Yang Ming Chiao Tung University, Taipei Medical University,
        National Tsing Hua University and National Chung Cheng University. Our primary objective is
        to rapidly develop new drugs for the treatment of neuropathic pain, as well as
        antithrombotic and cancer fighting agents. We currently hold several drug patents in the U.S.
      - >-
        The Structure-Based Fragment Hopping For Lead Optimization and Improvement method (U.S.
        Patent) performs a series of virtual screenings for compounds in order to uncover the
        relationship between quantitative determinations such as physicochemical properties or
        theoretical molecular descriptors and functions. It furthermore optimizes the compound's
        structure to improve its activity as well as reduce its toxicity. In addition to NRPB's
        funding, we have also received commissions to develop new drugs from the BioMedical
        Technology and Device Research Laboratory, Industrial Technology Research Institute, and
        the Medical and Pharmaceutical Industry Technology and Development Center. Our technology
        includes computational prediction of toxicity — hERG prediction models, prediction and
        mechanistic interpretation of human oral drug absorption, QSAR analysis of skin penetration
        and skin penetration enhancers, and QSAR models for skin sensitization.
      - >-
        In Metabolomics, we have built a research group at National Taiwan University and at the
        Metabolomics Core Laboratory in the NTU Center of Genomic Medicine. We were awarded Best
        Informatics Paper for the computational method developed in Metabolomics at the Seventh
        International Conference of the Metabolomics Society.
      - >-
        The mass spectrometry and NMR computing techniques developed in the lab have been applied
        to the study of workers' exposure to welding fumes, compound identification in Chinese
        herbs, prediction of toxicity in Chinese herbs, and the study of hypoxia's influence on
        breast cancer cells. They are also applied to finding molecular markers for lung cancer and
        leukaemia, and to predicting chronic obstructive pulmonary disease, bronchiectasis, acute
        lung injury, sepsis with multiple organ failure, and mortality among intensive-care
        patients receiving ECMO.
  zh:
    same_as_en: true

