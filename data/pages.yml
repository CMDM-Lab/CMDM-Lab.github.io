        - Large language models (LLM) for clinical assessment

# Representative papers shown on the Research page, one per research pillar plus
# DeePFAS at the lab's request (2026-08-22).
#
# EXCERPTS ARE REAL AND SOURCED. Each is the opening one or two sentences of the
# paper's own abstract, taken from Crossref where the publisher deposits one and
# from PubMed otherwise -- ACS and IEEE do not deposit abstracts to Crossref, so
# DeePFAS and the quantum-platforms paper came from PubMed. They are not
# paraphrased or written here. Structured-abstract section headers
# ("Background and Hypothesis") were stripped.
#
# ENGLISH IN BOTH LOCALES, deliberately. Paper titles, journal names and
# abstract text stay in their original language on the Chinese page -- the design
# system states this as correct academic practice, not an omission.
#
# `tag` follows the design system's register for brand-tone tags: instrument and
# assay classifications, not pillar names.
#
# FIGURES. `image` is the paper's own overview figure and `image_credit` is its
# attribution, which is not optional -- these are reused under CC licences that
# require it, and the design system puts a mono caption under every figure
# anyway.
#
# Only one entry has a figure so far, and that is a deliberate stop rather than
# an unfinished job. Of the six papers:
#
#   FastEval Parkinsonism   Figure 1 is a clean system schematic. Used.
#   Breathomics Dataset     Figure 1 is a dense asthma heat map -- illegible at
#                           the ~560px a ledger column gives it. Skipped.
#   Quantum platforms       "Figure 1" is an inline equation graphic, not a
#                           figure. Skipped.
#   DeePFAS                 CC-BY, but pubs.acs.org refuses automated requests
#                           (403). The lab are the authors and hold the file.
#   GNN p-gp                CC-BY-NC, but academic.oup.com also returns 403.
#   GenAI schizophrenia     OUP standard reuse terms, not a CC licence. Not used.
#
# The two figures the old site used (public/img/research.png and research_2.png)
# belong to the papers these entries replaced, so they are not reused here.
research_highlights:
  - title: A robust and interpretable graph neural network-based protocol for predicting p-glycoprotein substrates
    excerpt: >-
      P-glycoprotein (P-gp), a key member of the ATP-binding cassette (ABC) transporter family,
      plays a significant role in drug absorption and distribution by binding to diverse
      xenobiotics and actively transporting them out of cells. Given P-gp’s widespread expression,
      including its critical presence at the blood–brain barrier, identifying whether a compound
      functions as a P-gp substrate or inhibitor is essential in drug development to evaluate its
      ability to penetrate the central nervous system.
    tag: GNN
    meta: Briefings in Bioinformatics 26(4) · 2025 · 10.1093/bib/bbaf392
    doi: 10.1093/bib/bbaf392
  - title: A Clinical Breathomics Dataset
    excerpt: >-
      This study entailed a comprehensive GC-MS analysis conducted on 121 patient samples to
      generate a clinical breathomics dataset. Breath molecules, indicative of diverse conditions
      such as psychological and pathological states and the microbiome, were of particular
      interest due to their non-invasive nature.
    tag: GC-MS
    meta: Scientific Data 11(1) · 2024 · 10.1038/s41597-024-03052-2
    doi: 10.1038/s41597-024-03052-2
  - title: 'DeePFAS: Deep-Learning-Enabled Rapid Annotation of PFAS: Enhancing Nontargeted Screening through Spectral Encoding and Latent Space Analysis'
    excerpt: >-
      Detecting PFAS is challenging due to their diverse chemical structures, lack of standards,
      complex sample matrices, and the need for sensitive equipment to measure trace levels.
      Background contamination and the sheer number of PFAS further hinder the development of a
      universal detection method.
    tag: LC-HRMS
    meta: Environmental Science & Technology 59(46) · 2025 · 10.1021/acs.est.5c09769
    doi: 10.1021/acs.est.5c09769
  - title: Advantages of two quantum programming platforms in quantum computing and quantum chemistry
    excerpt: >-
      Quantum computing is at the forefront of technological advancement and has the potential to
      revolutionize various fields, including quantum chemistry. Choosing an appropriate quantum
      programming language becomes critical as quantum education and research increase.
    tag: QUANTUM
    meta: Journal of Cheminformatics 17(1) · 2025 · 10.1186/s13321-025-01026-z
    doi: 10.1186/s13321-025-01026-z
  - title: 'FastEval Parkinsonism: an instant deep learning–assisted video-based online system for Parkinsonian motor symptom evaluation'
    excerpt: >-
      The Motor Disorder Society’s Unified Parkinson’s Disease Rating Scale (MDS-UPDRS) is
      designed to assess bradykinesia, the cardinal symptoms of Parkinson’s disease (PD). However,
      it cannot capture the all-day variability of bradykinesia outside the clinical environment.
    tag: MDS-UPDRS
    meta: npj Digital Medicine 7(1) · 2024 · 10.1038/s41746-024-01022-x
    image: /img/papers/fasteval-parkinsonism.png
    image_credit: Figure 1, Yang et al., npj Digital Medicine 7, 31 (2024). CC BY 4.0
    doi: 10.1038/s41746-024-01022-x
  - title: Analyzing Generative AI and Machine Learning in Auto-Assessing Schizophrenia’s Negative Symptoms
    excerpt: >-
      Traditional assessments of schizophrenia’s negative symptoms rely on subjective and time-
      consuming psychiatric interviews. To provide more objective and efficient evaluations, this
      study examines the efficacy of an automated system utilizing generative AI (GenAI) and
      machine learning (ML) to assess negative symptoms of schizophrenia, including expression
      (EXP) and motivation and pleasure (MAP) domains.
    tag: LLM
    meta: Schizophrenia Bulletin 52(4) · 2025 · 10.1093/schbul/sbaf102
    doi: 10.1093/schbul/sbaf102

