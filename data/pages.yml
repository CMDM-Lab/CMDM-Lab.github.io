# Editorial prose for the pages that are not driven by a synced dataset.
#
# Migrated from contents/about_zh.html, contents/research_zh.html and
# contents/course_zh.html.
#
# TRANSLATION GAP -- needs the lab's attention.
#
# The old site had `_zh` variants of the About and Research pages, but their
# bodies were English prose, identical to the English pages.
#
# The About prose was replaced on 2026-09-08 with the PI's own text. That block
# has its own provenance note; read it before editing the paragraphs.
#
# DRAFT, 2026-08-22, AWAITING THE LAB'S APPROVAL -- research_areas and
# research_highlights below. Both were drafted at the lab's request from its own
# record: the publication list, the roster and the previous site's text. Nothing
# is invented; the provenance of each entry is noted beside it. But this is the
# lab describing itself, so it is the lab's to approve and edit. Change the
# wording freely; nothing derives from it.
#
# Counts are written out rather than computed because they read as prose here.
# tests/content.test.mjs checks each one against the data and fails when they
# drift, which is how the conference-paper and patent figures below came to be
# corrected on 2026-08-31 rather than quietly going stale.
# True on 2026-08-31: 113 journal articles since 2006 (44 since 2020), 98
# conference papers, 45 patents, 8 public services, 37 current members, 67
# alumni. The home page shows the live figures in its colophon.

about:
  # The first four paragraphs are the PI's own text, supplied on 2026-09-08 and
  # used as given. They carry no citations because they need none: this is the
  # lab stating its own direction, not a claim about the record that a reader
  # could check against a paper.
  #
  # Two acronyms gained an expansion on first use, per the design system's
  # vocabulary rule: "population PK/PD modeling" and "NMDA". Expanding NMDA in
  # place gave "synaptic N-methyl-D-aspartate (NMDA)-modulating compounds", so
  # that one clause was reordered to read as prose. Nothing else was reworded.
  #
  # The stray word "Memory" sat between the third and fourth paragraphs of the
  # supplied text. It is a paste artefact, not copy, and was dropped.
  #
  # WHAT THE NEW TEXT DOES NOT SAY, recorded so the next person does not read
  # the gaps as omissions to repair:
  #   - The five-pillar framing the 2026-08-22 prose opened with is gone.
  #     Medical image computing and AI agent systems are not mentioned, though
  #     the Research page still lists both and about_lede in data/i18n/*.yml
  #     still names all five. The lede was left alone on purpose: nobody but the
  #     lab writes the lab's lede. Raised with the lab on 2026-09-08.
  #   - YA-101, pharmacometrics and population PK/PD appear nowhere else in the
  #     repository -- not in publications.yml, not in research_areas. This page
  #     is the only one that names them.
  #
  # The GreenN and counts paragraphs are the 2026-08-23 and 2026-08-22 text,
  # kept deliberately. The commissioned system is five years of the lab's work
  # and the source of two entries on the honours page, and the counts paragraph
  # is the one tests/content.test.mjs reads.
  zh:
    # DRAFT TRANSLATION, 2026-09-08, AWAITING THE LAB'S APPROVAL. The first four
    # paragraphs are a Chinese rendering of the PI's English text, not text the
    # lab wrote in Chinese. Same footing as the 2026-08-22 Chinese draft: change
    # the wording freely, nothing derives from it. Terms chosen: 藥物計量學 for
    # pharmacometrics, 族群藥物動力學／藥效學 for population PK/PD, and
    # 帕金森氏症 to match research_areas below.
    paragraphs:
      - >-
        本實驗室整合計算化學、藥物計量學、代謝體學與神經科學，加速神經退化性疾病與腦部疾病的轉譯研究，並探索新興的量子計算方法以處理複雜的生醫問題。
      - >-
        我們研究阿茲海默症、帕金森氏症、額顳葉失智症與相關運動障礙等神經退化性疾病，涵蓋分子機制、生物標記與治療策略。代謝體學的比重逐漸提高，使我們得以剖析代謝路徑的變化，並找出將細胞層次的失能連結到病人層次表現型的轉譯生物標記。
      - >-
        本實驗室以先進的計算化學、族群藥物動力學／藥效學 (PK/PD) 模型、代謝體學分析與資料驅動的法規科學為基礎，據此理性設計並評估新型療法，包括調節突觸 N-甲基-D-天門冬胺酸 (NMDA) 受體的化合物，例如 YA-101。同時，我們開始納入量子啟發與量子計算方法，處理古典計算難以單獨應對的高維分子與系統層級問題。
      - >-
        本實驗室位於國立臺灣大學的頂尖學術與臨床環境，與國際轉譯研究計畫及生技產業贊助者合作，將代謝體學與計算驅動的發現推向真實世界的病人效益。這個生態系讓我們得以培育下一代科學家，使其兼具藥物計量學、代謝體學與先進計算的整合能力，並為全球神經治療藥物的開發提供嚴謹的決策支援。
      # Commissioned work, added 2026-08-23 at the lab's request: the About page had
      # said nothing about the one system the lab has run for five years, which is
      # also the work behind two of the awards on the honours page. Every fact here
      # is from the `commissioned` entry in services.yml and from honors.yml -- the
      # start date, the agency, what the system does, and the two awards.
      - >-
        除了論文與公開工具，本實驗室自 2021 年 9 月起承接環境部化學署委辦的「高風險化學物質之安全替代化學物質搜尋、評估及篩選系統」GreenN（SAS），協助企業掌握化學品的危害與風險、法規關注程度，並找出可行的替代方案，支援研發前期評估與法規遵循；計畫持續進行中。在既有架構上開發的「AI 綠色化學智匯診斷家」，於 2025 年總統盃黑客松獲卓越團隊獎，並獲 2026 年臺大 1975 級電機系系友捐贈科技研究創新獎勵特別獎。
      # Output and people. Every number here is counted from the data files, and
      # tests/content.test.mjs recounts them -- prose numbers go stale silently.
      #
      # Both people numbers moved on 2026-09-02, when the research assistant
      # post changed hands and became two posts. 現有成員 37 → 38: 葉芷瑜 and
      # 李哲宇 came in as the assistants and 張家瑜 left. 歷屆成員 67 → 68: those
      # two finished their master's here in 2026, and a graduate who stays on is
      # counted -- which is the point of the number, and why the total went up
      # by one rather than by two. See allAlumni() in src/lib/data.ts.
      #
      # 歷屆成員 68 → 70 on 2026-09-08: 李謙 and 楊淯元, both 2023, both found
      # in NTU's repository by scripts/find-thesis-records.mjs. They came from
      # the lab's own list of former members that day, but the list is not what
      # put them on the page -- the record is. The rest of that list is still
      # being reconciled, so this number will move again.
      #
      # 70 → 75 later the same day: 何蓓林, 江品億, 呂宗諭, 張乃文 and 黃雍文,
      # five people from that list who took no degree here -- two research
      # assistants, an administrator, and two research students who changed
      # advisor and left. The lab identified each on 2026-09-08. They are
      # 歷屆成員 on the same footing as the assistants already counted, which is
      # why the table is headed 歷屆成員 and not 畢業成員.
      #
      # The count starts at 2006, the lab's founding year. The journal list
      # reaches back to 2003, but those four entries (2003-2004, 4D-QSAR work at
      # UIC) are the PI's own postdoc publications from before the lab existed
      # and are not the lab's output. Corrected on 2026-08-22 at the lab's
      # instruction; the previous wording claimed all 117 since 2003.
      - >-
        實驗室自 2006 年創立以來發表 113 篇期刊論文，其中 44 篇在 2020 年之後，另有 98 篇會議論文與 45 項專利。我們在 cmdm.tw 網域下維運 8 項公開服務，包含 3Omics、Lipidpedia、CypRules、GC2MS、Chromaligner 與 PITracer，皆開放外部研究者使用。實驗室現有成員 38 人，歷屆成員 75 人。
  en:
    # The PI's text as supplied; see the note above the locales.
    paragraphs:
      - >-
        Our lab integrates computational chemistry, pharmacometrics, metabolomics, and neuroscience to accelerate translational research in neurodegenerative and brain disorders, while exploring emerging quantum computing approaches for complex biomedical problems.
      - >-
        We investigate neurodegenerative diseases such as Alzheimer’s disease, Parkinson’s disease, frontotemporal dementia, and related movement disorders, spanning molecular mechanisms, biomarkers, and therapeutic strategies. A growing emphasis on metabolomics allows us to dissect metabolic pathway alterations and identify translational biomarkers that connect cellular dysfunction to patient-level phenotypes.
      - >-
        The lab is built around state-of-the-art computational chemistry, population pharmacokinetic/pharmacodynamic (PK/PD) modeling, metabolomics analytics, and data-driven regulatory science, enabling rational design and evaluation of novel interventions, including compounds such as YA-101 that modulate the synaptic N-methyl-D-aspartate (NMDA) receptor. In parallel, we are beginning to incorporate quantum-inspired and quantum computing methods to tackle high-dimensional molecular and systems-level problems that are difficult to address with classical computation alone.
      - >-
        Embedded in a tier-1 academic and clinical environment at National Taiwan University, the lab partners with international translational programs and biotech sponsors to move metabolomics- and computation-driven insights toward real-world patient impact. This ecosystem allows us to train the next generation of scientists in integrative pharmacometrics, metabolomics, and advanced computation, while delivering rigorous decision support for neurotherapeutic development globally.
      # Sources are on the Chinese paragraph above.
      - >-
        Besides papers and public tools, the lab has run GreenN (SAS), the Searching, Assessment and Screening System for Safer Alternative Chemicals, since September 2021, commissioned by the Chemicals Administration of the Ministry of Environment. It helps companies assess the hazard and risk of a chemical, how closely it is regulated, and what it can be replaced with, supporting early-stage R&D decisions and regulatory compliance; the project is ongoing. "AI-Powered Green Chemistry Diagnostic Advisor", built on that framework, received a Team Excellence Award at the Presidential Hackathon 2025 and the Special Award in the 2026 NTU Electrical Engineering Class of 1975 Alumni Endowed Award for Technology Research Innovation.
      # See the note on the Chinese paragraph above: the count starts at the
      # lab's founding in 2006, not at the first entry in the journal list.
      - >-
        Since the lab was founded in 2006 it has published 113 journal articles, 44 of them since 2020, together with 98 conference papers and 45 patents. We maintain eight public services under cmdm.tw -- among them 3Omics, Lipidpedia, CypRules, GC2MS, Chromaligner and PITracer -- all open to external researchers. The lab currently has 38 members and 75 alumni.

