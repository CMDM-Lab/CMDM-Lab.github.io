  biography_zh:
    - 曾宇鳳教授 1997 年於國立臺灣大學藥學系畢業，並於 2002 年取得伊利諾大學芝加哥分校 (UIC) 藥物化學和生藥學博士學位。先後在 2003
      年、2005 年分別於伊利諾大學芝加哥分校、美國國家衛生研究院生物技術資訊中心 (NCBI) 擔任博士後研究員。
