    # was two things at once: a term that ended in 2021 written as if it were
    # open, and 藥物研發中心 for a centre the CV calls 藥物研究中心 throughout.
    - 曾教授於 2006 年返回臺灣擔任國立臺灣大學資訊工程系助理教授及生醫電子與資訊學研究所合聘教授，並同時擔任國立臺灣大學基因體研究中心代謝體核心實驗室主持人，以及國立臺灣大學藥物研究中心分子模擬小組負責人。2015
      至 2021 年擔任國立臺灣大學藥物研究中心主任，2021 年起主持該中心藥物資訊組。
    # The editorial sentence was entirely in the past tense and stopped at 2013,
    # while the CV's 專業相關服務 lists four editorial posts currently held. The
    # second sentence is those. Full list on the Activities page.
    - 曾教授曾擔任《組合化學和高通量篩選雜誌》特刊的特邀主編，並擔任《分子圖形與模擬雜誌》與《組合化學與高通量篩選雜誌》的編輯顧問，亦曾為美國化學學會化學資訊專業程序委員會成員，並擔任其藥物開發研討會主席。現任《Journal
      of Cheminformatics》副主編，以及《Scientific Data》與《Journal of Computer-Aided Molecular
      Design》編輯委員，並自 2024 年起擔任美國化學學會農業與食品化學部永續與綠色科技組主席。
