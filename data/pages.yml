home_intro:
  zh: 本實驗室主要研究內容為計算分子設計 (Computational Molecular Design) 與代謝體中的生物標記偵測 (Biomarker
    Detection in Metabolomics)，包含新演算法開發與軟體工具開發，使其能夠應用於生化檢驗與分子結構設計。
  en: The lab works on Computational Molecular Design and Biomarker Detection in Metabolomics,
    developing new algorithms and software tools for biochemical assays and molecular structure
    design.

