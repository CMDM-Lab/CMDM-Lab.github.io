# Editorial prose for the pages that are not driven by a synced dataset.
#
# Migrated from contents/about_zh.html, contents/research_zh.html and
# contents/course_zh.html.
#
# TRANSLATION GAP -- needs the lab's attention.
#
# The old site had `_zh` variants of the About and Research pages, but their
# bodies were English prose, identical to the English pages.
#
# DRAFT, 2026-08-22, AWAITING THE LAB'S APPROVAL. The paragraphs below were
# drafted at the lab's request from its own record -- the publication list, the
# research pillars, the roster and the previous site's About text. Nothing is
# invented; the provenance of each paragraph is noted beside it. But this is the
# lab describing itself, so it is the lab's to approve and edit. Change the
# wording freely; nothing derives from it.
#
# Counts are written out rather than computed because they read as prose here.
# They were true on 2026-08-22: 117 journal articles (44 since 2020), 64
# conference papers, 16 patents, 8 public services, 41 current members, 66
# alumni. The home page shows the live figures in its colophon.

about:
  zh:
    paragraphs:
      # Scope. The five pillars from research_areas, in the lab's own terms.
      - >-
        本實驗室以計算方法研究分子與代謝物。創立之初的兩大主軸為計算分子設計與代謝體學生物標記偵測，近年延伸至量子計算、步態分析與 AI Agent
        系統，共五個方向。我們開發演算法與軟體工具，並將其應用於藥物開發與臨床檢驗。
      # Drug design track. NRPB projects, partners, patents, prediction models --
      # all carried over from the previous site's About text.
      - >-
        在計算分子設計方面，本實驗室參與國家生技醫藥研究計畫的六項新藥開發專案，與中國醫藥大學、國立清華大學、臺北醫學大學等校的化學與藥學系所合作，目標為神經病理性疼痛、血栓與癌症的治療藥物，並持有多項美國專利。所建立的預測模型涵蓋
        hERG 心臟毒性、人體口服吸收、皮膚穿透與皮膚敏感化的 QSAR 分析。
      # Metabolomics track. Metabolomics Core Lab, MS/NMR methods, the Analytical
      # Chemistry record (6 papers), and the clinical applications the old text
      # lists.
      - >-
        在代謝體學方面，本實驗室於臺大基因體研究中心代謝體核心實驗室建立研究團隊，開發質譜與核磁共振的計算方法，成果發表於《Analytical
        Chemistry》等期刊，並曾獲國際代謝體學會年會最佳資訊學論文獎。這些方法已應用於焊接煙塵暴露、中草藥成分鑑定與毒性預測、乳癌細胞缺氧反應，以及肺癌、白血病、慢性阻塞性肺病與加護病房死亡率的標記研究。
      # Newer directions. The journals were dropped from the prose at the lab's
      # request -- the reader can find them on the Publications page -- but they
      # are recorded here so the claim stays traceable:
      #   quantum computing  Journal of Cheminformatics, Scientific Reports
      #   gait / movement    npj Digital Medicine, IEEE J. Biomed. Health Inform.
      #   LLM for clinical   Schizophrenia Bulletin
      - >-
        近年新增的三個方向已有發表成果：量子計算應用於藥物探索與專利檢索、影像式步態與帕金森氏症動作分析，以及大型語言模型應用於臨床評估。
      # Output and people. Numbers from the data files; tools from services.yml.
      - >-
        實驗室自 2003 年起發表 117 篇期刊論文，其中 44 篇在 2020 年之後，另有 64 篇會議論文與 16 項專利。我們在 cmdm.tw
        網域下維運 8 項公開服務，包含 3Omics、Lipidpedia、CypRules、GC2MS、Chromaligner 與
        PITracer，皆開放外部研究者使用。實驗室現有成員 41 人，畢業校友 66 人。
  en:
    paragraphs:
      - >-
        The lab studies molecules and metabolites by computation. Its two founding
        directions were computational molecular design and biomarker detection in
        metabolomics; in recent years these have been joined by quantum computing, gait
        analysis and AI agent systems, giving five research pillars. We develop algorithms and
        software tools, and apply them to drug development and clinical assay work.
      - >-
        In computational molecular design, the lab took part in six drug development projects
        under the National Research Program for Biopharmaceuticals, working with the chemistry
        and pharmacy departments of China Medical University, National Tsing Hua University and
        Taipei Medical University among others. The targets were treatments for neuropathic
        pain, thrombosis and cancer, and the work holds several U.S. patents. The predictive
        models built here cover hERG cardiotoxicity, human oral drug absorption, and QSAR
        analyses of skin penetration and skin sensitization.
      - >-
        In metabolomics, the lab built a research group at the Metabolomics Core Laboratory of
        the NTU Center of Genomic Medicine, developing mass-spectrometry and NMR computing
        methods published in Analytical Chemistry and elsewhere, and received the Best
        Informatics Paper award at an International Conference of the Metabolomics Society.
        Those methods have been applied to welding-fume exposure, compound identification and
        toxicity prediction in Chinese herbs, hypoxia in breast cancer cells, and markers for
        lung cancer, leukaemia, chronic obstructive pulmonary disease and mortality among
        intensive-care patients.
      # See the note on the Chinese paragraph above for the journals behind each
      # of these three, which the lab asked to keep out of the prose.
      - >-
        The three newer directions each have published results: quantum computing for drug
        discovery and patent search, video-based gait and Parkinsonian movement analysis, and
        large language models for clinical assessment.
      - >-
        Since 2003 the lab has published 117 journal articles, 44 of them since 2020, together
        with 64 conference papers and 16 patents. We maintain eight public services under
        cmdm.tw -- among them 3Omics, Lipidpedia, CypRules, GC2MS, Chromaligner and PITracer --
        all open to external researchers. The lab currently has 41 members and 66 alumni.

